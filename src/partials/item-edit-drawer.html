<div class="quote-drawer-overlay" id="itemEditOverlay"></div>
<aside class="quote-drawer" id="itemEditDrawer" role="dialog" aria-modal="true" aria-labelledby="itemEditHeaderTitle" aria-hidden="true">
  <div class="quote-drawer__header">
    <h2 class="quote-drawer__title" id="itemEditHeaderTitle">Edit item</h2>
    <button type="button" class="quote-drawer__close" id="itemEditClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="item-edit-drawer__body">
    <h1 class="pdp__title" id="itemEditTitle"></h1>
    <div class="pdp__promo">
      <p class="pdp__promo-text" id="itemEditDesc"></p>
    </div>

    <div class="item-edit-drawer__photo" id="itemEditPhoto"></div>

    <div class="item-edit-drawer__section" id="itemEditColorRow" hidden>
      <p class="pdp__field-label">Material colour</p>
      <div class="pdp__swatches" id="itemEditSwatches"></div>
      <div class="pdp__swatch-label" id="itemEditSwatchLabel"></div>
    </div>

    <div class="item-edit-drawer__section">
      <p class="pdp__field-label">Quantity</p>
      <div class="pdp__qty" id="itemEditQty">
        <button type="button" class="pdp__qty-toggle" id="itemEditQtyToggle" aria-haspopup="listbox" aria-expanded="false" aria-controls="itemEditQtyPanel">
          <span class="pdp__qty-toggle-qty"></span>
          <span class="pdp__qty-toggle-total"></span>
          <svg class="pdp__qty-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="pdp__qty-panel" id="itemEditQtyPanel" role="listbox"></div>
      </div>
    </div>

    <div class="item-edit-drawer__section" id="itemEditSizeRow" hidden>
      <p class="pdp__field-label">Size (external)</p>
      <div class="pdp__qty-toggle pdp__qty-toggle--static" id="itemEditSizeBox">
        <span id="itemEditSizeText"></span>
      </div>
    </div>

    <div class="item-edit-drawer__section" id="itemEditSizesRow" hidden>
      <p class="pdp__field-label">Size</p>
      <div class="pdp__sizes" id="itemEditSizes"></div>
    </div>
  </div>
  <div class="item-edit-drawer__footer">
    <button type="button" class="btn btn--dark pdp__cta" id="itemEditSave"><span>Save</span></button>
  </div>
</aside>
