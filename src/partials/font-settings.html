<section class="font-settings" id="fontSettings" aria-label="Display settings">
  <div class="font-settings__panel" id="fontSettingsPanel">
    <div class="font-settings__row">
      <span class="font-settings__label" id="fontSettingsLabel">Sans-Serif</span>
      <label class="font-switch">
        <input type="checkbox" id="fontSwitch" aria-labelledby="fontSettingsLabel">
        <span class="font-switch__track"></span>
      </label>
    </div>
    <div class="font-settings__row">
      <span class="font-settings__label" id="amplifySettingsLabel">Amplify</span>
      <label class="font-switch">
        <input type="checkbox" id="amplifySwitch" aria-labelledby="amplifySettingsLabel">
        <span class="font-switch__track"></span>
      </label>
    </div>
    <div class="font-settings__row" id="stockLayoutSettingsRow" hidden>
      <span class="font-settings__label" id="stockLayoutSettingsLabel">Stock layout</span>
      <label class="font-switch">
        <input type="checkbox" id="stockLayoutSwitch" aria-labelledby="stockLayoutSettingsLabel">
        <span class="font-switch__track"></span>
      </label>
    </div>
  </div>
  <button type="button" id="fontSettingsToggle" class="font-settings__toggle" aria-expanded="false" aria-label="Font settings">
