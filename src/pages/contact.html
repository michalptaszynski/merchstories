<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact &mdash; Merch Stories</title>
<meta name="description" content="Tell us about your project. Free designs and a full quote within 24 hours.">
<!--#include file="head-links.html" -->
</head>
<body>

<!--#include file="password-gate.html" -->

<div id="siteContent" style="display:none;">

<!--#include file="nav-header.html" -->

<main>

<div class="contact-form-page">
  <div class="contact-form-page__head">
    <p class="shop-breadcrumb"><a href="index.html">Merch Stories</a> / <span>Get in touch</span></p>
    <h1 class="contact-form-page__title">Get in touch</h1>
    <p class="contact-form-page__subtitle">Tell us about your project. Free designs and a full quote within 24 hours.</p>
  </div>

  <form class="contact-form" id="contactForm">
    <div class="contact-form__field">
      <label for="cfName">Name <span class="contact-form__required">*</span></label>
      <input id="cfName" name="name" type="text" placeholder="Name" required>
    </div>

    <div class="contact-form__field">
      <label for="cfEmail">Work email <span class="contact-form__required">*</span></label>
      <input id="cfEmail" name="email" type="email" placeholder="name@work.com" required>
    </div>

    <div class="contact-form__field">
      <label for="cfPhone">Phone number</label>
      <div class="phone-input">
        <button type="button" class="phone-input__trigger" aria-haspopup="listbox" aria-expanded="false">
          <span class="phone-input__flag"><img src="assets/flags/pl.svg" alt=""></span>
          <span class="phone-input__dial">+48</span>
          <svg class="phone-input__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <input id="cfPhone" name="phone" type="tel" class="phone-input__number" placeholder="6 12 34 56 78">
        <input type="hidden" name="phone_country_code" class="phone-input__dial-code" value="+48">
        <div class="phone-input__panel" hidden>
          <input type="text" class="phone-input__search" placeholder="Search country&hellip;">
          <div class="phone-input__list"></div>
        </div>
      </div>
    </div>

    <div class="contact-form__field">
      <label for="cfCompany">Company</label>
      <input id="cfCompany" name="company" type="text" placeholder="Company">
    </div>

    <div class="contact-form__field">
      <label for="cfCountry">Country/region</label>
      <div class="region-input">
        <button type="button" id="cfCountry" class="region-input__trigger" aria-haspopup="listbox" aria-expanded="false">
          <span class="region-input__value">Select&hellip;</span>
          <svg class="region-input__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <input type="hidden" name="country">
        <div class="region-input__panel" hidden>
          <input type="text" class="region-input__search" placeholder="Search country&hellip;">
          <div class="region-input__list"></div>
        </div>
      </div>
    </div>

    <div class="contact-form__field">
      <label for="cfProjectType">Project type</label>
      <select id="cfProjectType" name="project_type">
        <option value="" disabled selected>Select&hellip;</option>
        <option>New merch drop</option>
        <option>Company store</option>
        <option>Custom packaging</option>
        <option>Reorder</option>
        <option>Other</option>
      </select>
    </div>

    <div class="contact-form__field">
      <label for="cfBudget">Budget</label>
      <select id="cfBudget" name="budget">
        <option value="" disabled selected>Select&hellip;</option>
        <option>Under $2,000</option>
        <option>$2,000&ndash;$10,000</option>
        <option>$10,000&ndash;$50,000</option>
        <option>$50,000+</option>
      </select>
    </div>

    <div class="contact-form__field">
      <label for="cfEventDate">When do you need this by? <span class="contact-form__required">*</span></label>
      <input id="cfEventDate" name="event_date" type="date" required>
    </div>

    <div class="contact-form__field">
      <label for="cfMessage">What can we help you with?</label>
      <textarea id="cfMessage" name="message" rows="5" placeholder="Let us know what we can do for you."></textarea>
    </div>

    <div class="contact-form__field">
      <label for="cfFile">File upload</label>
      <label class="contact-form__upload" for="cfFile">
        <input id="cfFile" name="file" type="file" class="visually-hidden" multiple>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
        <span>Click to upload or drag and drop. Max 25&nbsp;MB.</span>
      </label>
      <ul class="contact-form__files" id="cfFilesList" hidden></ul>
    </div>

    <button type="submit" class="contact-form__submit">Submit</button>
  </form>
</div>

<!--#include file="footer-cta.html" -->

</main>

<script src="quote-drawer.js"></script>
<script src="phone-input.js"></script>
<script src="region-input.js"></script>
<script src="file-upload.js"></script>
<script src="nav-megamenu.js"></script>
<script src="mobile-nav.js"></script>
<script src="country-modal.js"></script>
<script src="form-success.js"></script>

</div>

<script src="password-gate.js"></script>
</body>
</html>
